<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saved Accounts — FoodRescue PH</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-[#fefae0] text-slate-800 min-h-screen p-6">

    <div class="max-w-4xl mx-auto">
        <!-- Header -->
        <div class="flex items-center justify-between mb-8 bg-white p-6 rounded-3xl shadow-md border-4 border-emerald-600">
            <div>
                <h1 class="text-2xl sm:text-3xl font-extrabold text-emerald-900">👥 Saved Accounts Directory</h1>
                <p class="text-slate-600 font-medium text-sm">List of all registered members in FoodRescue PH.</p>
            </div>
            <a href="dashboard.html" class="bg-emerald-600 hover:bg-emerald-700 text-white font-extrabold px-4 py-2 rounded-xl text-sm transition">
                Back to Dashboard
            </a>
        </div>

        <!-- Accounts Table Container -->
        <div class="bg-white rounded-3xl shadow-xl border-2 border-slate-200 overflow-hidden">
            <div class="p-6 overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="border-b-2 border-slate-200 text-emerald-900 font-extrabold">
                            <th class="py-3 px-4">Full Name</th>
                            <th class="py-3 px-4">Mobile Number</th>
                            <th class="py-3 px-4">Barangay / Location</th>
                        </tr>
                    </thead>
                    <tbody id="users-table-body" class="divide-y divide-slate-100 font-medium text-slate-700">
                        <tr>
                            <td colspan="3" class="py-6 text-center text-slate-400">Loading saved accounts...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        async function fetchUsers() {
            try {
                // Update with your live backend URL
                const response = await fetch('https://supreme-invention-77vx9wx75vp72p74j-3001.app.github.dev/api/users');
                const data = await response.json();

                const tbody = document.getElementById('users-table-body');
                if (data.success && data.users.length > 0) {
                    tbody.innerHTML = data.users.map(user => `
                        <tr class="hover:bg-emerald-50/50 transition">
                            <td class="py-4 px-4 font-bold text-emerald-900">${user.fullname}</td>
                            <td class="py-4 px-4">${user.mobile}</td>
                            <td class="py-4 px-4">${user.barangay}</td>
                        </tr>
                    `).join('');
                } else {
                    tbody.innerHTML = `<tr><td colspan="3" class="py-6 text-center text-slate-500 font-bold">No registered accounts found yet.</td></tr>`;
                }
            } catch (error) {
                console.error('Error fetching users:', error);
                document.getElementById('users-table-body').innerHTML = `<tr><td colspan="3" class="py-6 text-center text-red-500 font-bold">Could not connect to backend server.</td></tr>`;
            }
        }

        fetchUsers();
    </script>
</body>
</html>
